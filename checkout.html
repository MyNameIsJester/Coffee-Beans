<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Thanh toán - Cà Phê Đậm Đà</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="styles/user.css" />
        <link rel="stylesheet" href="styles/header.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <style>
            /* Animations */
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @keyframes pulse {
                0% {
                    transform: scale(1);
                }
                50% {
                    transform: scale(1.05);
                }
                100% {
                    transform: scale(1);
                }
            }

            /* Form styles */
            .form-control:focus {
                border-color: var(--coffee-500);
                box-shadow: 0 0 0 0.25rem rgba(139, 87, 42, 0.25);
            }

            .is-invalid {
                border-color: #dc3545 !important;
                animation: shake 0.5s;
            }

            @keyframes shake {
                0%,
                100% {
                    transform: translateX(0);
                }
                25% {
                    transform: translateX(-5px);
                }
                75% {
                    transform: translateX(5px);
                }
            }

            /* Loading states */
            .loading {
                position: relative;
                pointer-events: none;
                opacity: 0.8;
            }

            .loading::after {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(255, 255, 255, 0.8);
                z-index: 1;
                border-radius: 8px;
            }

            /* Button animations */
            .btn-checkout {
                transition: all 0.3s ease;
                position: relative;
                overflow: hidden;
            }

            .btn-checkout:disabled {
                opacity: 0.7;
                cursor: not-allowed;
            }

            .btn-checkout.animate-pulse {
                animation: pulse 1.5s infinite;
            }

            /* Cart item animations */
            .cart-item {
                transition: all 0.3s ease;
                position: relative;
            }

            .cart-item.updating {
                opacity: 0.7;
                pointer-events: none;
            }

            /* Success state */
            .order-success {
                animation: fadeIn 0.5s ease-out;
            }

            /* Payment method selection */
            .payment-option {
                transition: all 0.2s ease;
                position: relative;
                overflow: hidden;
            }

            .payment-option::after {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, 0.2),
                    transparent
                );
                transform: translateX(-100%);
                transition: transform 0.6s;
            }

            .payment-option:hover::after {
                transform: translateX(100%);
            }

            .payment-option.selected {
                border-color: var(--coffee-500);
                background-color: rgba(139, 87, 42, 0.05);
            }

            /* Responsive adjustments */
            @media (max-width: 768px) {
                .checkout-container {
                    grid-template-columns: 1fr;
                    gap: 1.5rem;
                }

                .checkout-section {
                    padding: 1.5rem;
                }
            }
            /* Checkout Page Specific Styles */
            .checkout-container {
                display: grid;
                grid-template-columns: 1.5fr 1fr;
                gap: 2rem;
                margin-top: 2rem;
            }

            .checkout-section {
                background: #fff;
                border-radius: 12px;
                padding: 2rem;
                box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05);
                margin-bottom: 1.5rem;
            }

            .section-title {
                font-size: 1.25rem;
                font-weight: 600;
                color: #2d3748;
                margin-bottom: 1.5rem;
                padding-bottom: 0.75rem;
                border-bottom: 1px solid #edf2f7;
            }

            .form-group {
                margin-bottom: 1.5rem;
            }

            .form-group label {
                display: block;
                margin-bottom: 0.5rem;
                font-weight: 500;
                color: #4a5568;
            }

            .form-control {
                width: 100%;
                padding: 0.75rem 1rem;
                border: 1px solid #e2e8f0;
                border-radius: 8px;
                font-size: 1rem;
                transition: all 0.2s ease;
            }

            .form-control:focus {
                outline: none;
                border-color: var(--coffee-500);
                box-shadow: 0 0 0 3px rgba(209, 160, 111, 0.2);
            }

            textarea.form-control {
                min-height: 100px;
                resize: vertical;
            }

            .payment-option {
                display: flex;
                align-items: center;
                padding: 1rem;
                border: 1px solid #e2e8f0;
                border-radius: 8px;
                margin-bottom: 0.75rem;
                cursor: pointer;
                transition: all 0.2s ease;
            }

            .payment-option:hover {
                border-color: var(--coffee-400);
            }

            .payment-option.selected {
                border-color: var(--coffee-500);
                background-color: #fffaf5;
            }

            .payment-option .icon {
                font-size: 1.5rem;
                color: var(--coffee-500);
                margin-right: 1rem;
            }

            .payment-option div {
                flex: 1;
            }

            .payment-option small {
                display: block;
                color: #718096;
                font-size: 0.875rem;
                margin-top: 0.25rem;
            }

            .order-summary {
                background: #f8fafc;
                border-radius: 8px;
                padding: 1.5rem;
                margin-top: 1.5rem;
            }

            .order-summary-item {
                display: flex;
                justify-content: space-between;
                margin-bottom: 0.75rem;
                color: #4a5568;
            }

            .order-total {
                display: flex;
                justify-content: space-between;
                font-size: 1.125rem;
                font-weight: 600;
                color: #2d3748;
                padding-top: 1rem;
                margin-top: 1rem;
                border-top: 1px solid #e2e8f0;
            }

            .btn-checkout {
                width: 100%;
                background-color: grey;
                color: white;
                border: none;
                padding: 1rem;
                font-size: 1.125rem;
                font-weight: 600;
                border-radius: 8px;
                cursor: pointer;
                transition: background-color 0.2s ease;
                margin-top: 1.5rem;
            }

            .btn-checkout:hover {
                background-color: var(--coffee-700);
            }

            .btn-checkout:disabled {
                background-color: #cbd5e0;
                cursor: not-allowed;
            }

            .cart-item {
                display: flex;
                align-items: center;
                padding: 1rem 0;
                border-bottom: 1px solid #edf2f7;
            }

            .cart-item img {
                width: 80px;
                height: 80px;
                object-fit: cover;
                border-radius: 8px;
                margin-right: 1rem;
            }

            .cart-item-details {
                flex: 1;
            }

            .cart-item-title {
                font-weight: 500;
                margin-bottom: 0.25rem;
            }

            .cart-item-price {
                color: var(--coffee-600);
                font-weight: 600;
            }

            .cart-item-quantity {
                display: flex;
                align-items: center;
            }

            .quantity-btn {
                width: 32px;
                height: 32px;
                border: 1px solid #e2e8f0;
                background: white;
                font-size: 1rem;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.2s ease;
            }

            .quantity-btn:hover {
                background: #f7fafc;
                border-color: #cbd5e0;
            }

            .quantity-input {
                width: 50px;
                height: 32px;
                text-align: center;
                border: 1px solid #e2e8f0;
                margin: 0 0.5rem;
                border-radius: 4px;
            }

            /* Responsive Design */
            @media (max-width: 1024px) {
                .checkout-container {
                    grid-template-columns: 1fr;
                }

                .checkout-section {
                    position: static !important;
                }
            }

            @media (max-width: 640px) {
                .cart-item {
                    flex-direction: column;
                    align-items: flex-start;
                }

                .cart-item img {
                    margin-bottom: 1rem;
                }

                .cart-item-quantity {
                    margin-top: 0.75rem;
                    width: 100%;
                    justify-content: space-between;
                }
            }

            /* Loading state */
            .loading {
                position: relative;
                pointer-events: none;
                opacity: 0.8;
            }

            .loading::after {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(255, 255, 255, 0.8);
                z-index: 1;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            /* Animations */
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .checkout-section {
                animation: fadeIn 0.3s ease-out;
            }
        </style>
    </head>
    <body>
        <!-- Header (reuse) -->
        <div id="siteHeader"></div>
        <main id="checkoutRoot" class="container" style="padding: 2rem 1.25rem; max-width: 1200px; margin: 0 auto"></main>

        <script src="js/db.js"></script>
        <script src="js/catalog.js"></script>
        <script src="js/inventory.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/shop.js"></script>
        <script src="js/seed.js"></script>
        <script src="js/ui.js"></script>
        <script src="js/page-checkout.js"></script>
    </body>
</html>
