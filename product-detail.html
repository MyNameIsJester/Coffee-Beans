<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Chi tiết sản phẩm - Cà Phê Đậm Đà</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="styles/user.css" />
        <link rel="stylesheet" href="styles/header.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        <style>
            /* Product Detail Page Styles */
            .product-container {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 3rem;
                margin: 3rem 0;
                align-items: start;
            }

            .product-gallery {
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }

            .product-gallery-main {
                position: relative;
                border-radius: 16px;
                overflow: hidden;
                background: #f8f6f3;
                aspect-ratio: 1;
            }

            .product-gallery-main img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .gallery-thumbnails {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 0.75rem;
            }

            .gallery-thumbnail {
                border-radius: 12px;
                overflow: hidden;
                cursor: pointer;
                border: 2px solid transparent;
                transition: border-color 0.2s ease;
                aspect-ratio: 1;
            }

            .gallery-thumbnail img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .gallery-thumbnail:hover,
            .gallery-thumbnail.active {
                border-color: var(--coffee);
            }

            .product-info {
                display: flex;
                flex-direction: column;
                gap: 1.5rem;
            }

            .product-header {
                border-bottom: 1px solid #e2e8f0;
                padding-bottom: 1.5rem;
            }

            .product-category {
                display: inline-block;
                background: rgba(139, 87, 42, 0.1);
                color: var(--coffee);
                padding: 0.5rem 1rem;
                border-radius: 8px;
                font-size: 0.875rem;
                font-weight: 600;
                margin-bottom: 0.75rem;
            }

            .product-title {
                font-family: "Playfair Display", serif;
                font-size: 2.5rem;
                font-weight: 700;
                color: var(--coffee-900);
                margin: 0.5rem 0;
            }

            .product-rating {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                margin-bottom: 1rem;
            }

            .stars {
                color: #ffc107;
                font-size: 1rem;
            }

            .rating-count {
                color: #666;
                font-size: 0.875rem;
            }

            .product-price-section {
                display: flex;
                align-items: baseline;
                gap: 1rem;
            }

            .product-price {
                font-size: 2rem;
                font-weight: 700;
                color: var(--coffee);
            }

            .product-original-price {
                font-size: 1.25rem;
                color: #999;
                text-decoration: line-through;
            }

            .discount-badge {
                background: #e53e3e;
                color: white;
                padding: 0.5rem 0.75rem;
                border-radius: 6px;
                font-weight: 600;
                font-size: 0.875rem;
            }

            .product-description {
                line-height: 1.8;
                color: #4a5568;
                font-size: 1rem;
            }

            .product-details {
                background: #f8fafc;
                padding: 1.5rem;
                border-radius: 12px;
            }

            .detail-row {
                display: flex;
                justify-content: space-between;
                padding: 0.75rem 0;
                border-bottom: 1px solid #e2e8f0;
            }

            .detail-row:last-child {
                border-bottom: none;
            }

            .detail-label {
                color: #666;
                font-weight: 500;
            }

            .detail-value {
                font-weight: 600;
                color: var(--coffee-900);
            }

            .product-benefits {
                background: #fffaf5;
                padding: 1.5rem;
                border-radius: 12px;
                border-left: 4px solid var(--coffee);
            }

            .benefits-title {
                font-weight: 600;
                color: var(--coffee-900);
                margin-bottom: 1rem;
            }

            .benefits-list {
                list-style: none;
                padding: 0;
                margin: 0;
            }

            .benefits-list li {
                padding: 0.5rem 0;
                color: #555;
                display: flex;
                align-items: center;
                gap: 0.75rem;
            }

            .benefits-list li:before {
                content: "✓";
                color: var(--coffee);
                font-weight: 700;
                font-size: 1.1rem;
            }

            .quantity-section {
                display: flex;
                align-items: center;
                gap: 1.5rem;
            }

            .quantity-control {
                display: flex;
                align-items: center;
                border: 1px solid #e2e8f0;
                border-radius: 8px;
                overflow: hidden;
            }

            .quantity-btn {
                width: 2.5rem;
                height: 2.5rem;
                border: none;
                background: #f7fafc;
                cursor: pointer;
                font-size: 1.2rem;
                transition: background-color 0.2s ease;
                color: var(--coffee);
            }

            .quantity-btn:hover {
                background: #e2e8f0;
            }

            .quantity-input {
                width: 3rem;
                text-align: center;
                border: none;
                font-size: 1rem;
                font-weight: 600;
                color: var(--coffee-900);
            }

            .quantity-input:focus {
                outline: none;
            }

            .add-to-cart-btn {
                flex: 1;
                padding: 1rem 1.5rem;
                background: var(--coffee);
                color: white;
                border: none;
                border-radius: 8px;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                transition: background-color 0.2s ease;
            }

            .add-to-cart-btn:hover {
                background: var(--coffee-700);
            }

            .buy-now-btn {
                flex: 1;
                padding: 1rem 1.5rem;
                background: #d6b692;
                color: var(--coffee-900);
                border: none;
                border-radius: 8px;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                transition: background-color 0.2s ease;
            }

            .buy-now-btn:hover {
                background: #c9a685;
            }

            .action-buttons {
                display: flex;
                gap: 1rem;
            }

            .wishlist-btn {
                width: 2.5rem;
                height: 2.5rem;
                border: 1px solid #e2e8f0;
                background: white;
                border-radius: 8px;
                cursor: pointer;
                font-size: 1.2rem;
                transition: all 0.2s ease;
            }

            .wishlist-btn:hover {
                border-color: var(--coffee);
                color: var(--coffee);
            }

            .stock-status {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                padding: 0.75rem 0;
                font-weight: 600;
            }

            .stock-status.in-stock {
                color: #22863a;
            }

            .stock-status.out-of-stock { background: #fdecea; color: #c62828; }
            .add-to-cart-btn:disabled, .quantity-btn:disabled { opacity: 0.5; cursor: not-allowed; }
            .stock-status.low-stock {
                color: #ff9800;
            }

            .related-products {
                margin-top: 4rem;
                padding-top: 2rem;
                border-top: 1px solid #e2e8f0;
            }

            .related-title {
                font-family: "Playfair Display", serif;
                font-size: 1.75rem;
                font-weight: 700;
                color: var(--coffee-900);
                margin-bottom: 2rem;
            }

            .related-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 1.5rem;
            }

            .product-card {
                background: white;
                border-radius: 12px;
                overflow: hidden;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
                transition: transform 0.2s ease, box-shadow 0.2s ease;
                cursor: pointer;
            }

            .product-card:hover {
                transform: translateY(-4px);
                box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
            }

            .product-card-image {
                width: 100%;
                height: 200px;
                object-fit: cover;
                background: #f8f6f3;
            }

            .product-card-body {
                padding: 1rem;
            }

            .product-card-category {
                font-size: 0.75rem;
                color: var(--coffee);
                font-weight: 600;
                text-transform: uppercase;
                margin-bottom: 0.5rem;
            }

            .product-card-name {
                font-size: 1rem;
                font-weight: 600;
                color: var(--coffee-900);
                margin-bottom: 0.5rem;
            }

            .product-card-price {
                color: var(--coffee);
                font-weight: 700;
                margin-bottom: 0.75rem;
            }

            .product-card-btn {
                width: 100%;
                padding: 0.5rem;
                background: var(--coffee);
                color: white;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-size: 0.875rem;
                font-weight: 600;
                transition: background-color 0.2s ease;
            }

            .product-card-btn:hover {
                background: var(--coffee-700);
            }

            /* Responsive Design */
            @media (max-width: 1024px) {
                .product-container {
                    grid-template-columns: 1fr;
                    gap: 2rem;
                }

                .related-grid {
                    grid-template-columns: repeat(2, 1fr);
                }

                .product-title {
                    font-size: 2rem;
                }
            }

            @media (max-width: 640px) {
                .product-container {
                    gap: 1.5rem;
                }

                .product-title {
                    font-size: 1.5rem;
                }

                .product-price {
                    font-size: 1.5rem;
                }

                .related-grid {
                    grid-template-columns: 1fr;
                }

                .action-buttons {
                    flex-direction: column;
                }

                .quantity-section {
                    flex-direction: column;
                }

                .add-to-cart-btn,
                .buy-now-btn {
                    width: 100%;
                }
            }
        </style>
    </head>
    <body>
        <!-- Header -->
        <div id="siteHeader"></div>
        <main class="container" style="padding: 2rem 0;" id="productRoot"></main>

        <!-- Footer -->
        <footer id="lien-he">
            <div class="container foot">
                <div>
                    <h4>Cà Phê Đậm Đà</h4>
                    <p>Hạt cà phê rang xay chất lượng cao. Đồng hành cùng ly cà phê ngon mỗi ngày.</p>
                </div>
                <div>
                    <h4>Liên hệ</h4>
                    <p>Hotline: 0901 234 567<br />Email: hello@caphedamda.vn</p>
                </div>
                <div>
                    <h4>Địa chỉ</h4>
                    <p>123 Phin Street, Quận Caffeine, TP.HCM</p>
                </div>
            </div>
            <div class="container copyright">
                © 2025 Cà Phê Đậm Đà. All rights reserved.
            </div>
        </footer>

        <script src="js/db.js"></script>
        <script src="js/catalog.js"></script>
        <script src="js/inventory.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/shop.js"></script>
        <script src="js/seed.js"></script>
        <script src="js/ui.js"></script>
        <script src="js/page-product-detail.js"></script>

        <!-- Back to Top Button -->
        <button id="backToTop" class="back-to-top" onclick="scrollToTop()">↑</button>
        
        <style>
        .back-to-top {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #8B4513, #D2691E);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
            box-shadow: 0 4px 12px rgba(139, 69, 19, 0.3);
        }
        
        .back-to-top:hover {
            background: linear-gradient(135deg, #D2691E, #8B4513);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(139, 69, 19, 0.4);
        }
        
        .back-to-top.show {
            opacity: 1;
            visibility: visible;
        }
        </style>
        
        <script>
        window.addEventListener('scroll', function() {
            const backToTopButton = document.getElementById('backToTop');
            if (window.pageYOffset > 300) {
                backToTopButton.classList.add('show');
            } else {
                backToTopButton.classList.remove('show');
            }
        });
        
        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }
        </script>
    </body>
</html>
